name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's `packageManager`.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check

      # Regenerates sanity.types.ts, then type-checks against it.
      - run: pnpm check

      - name: Fail if sanity.types.ts was not regenerated and committed
        run: |
          if [ -n "$(git status --porcelain -- sanity.types.ts)" ]; then
            git --no-pager diff -- sanity.types.ts
            echo "::error file=sanity.types.ts::Out of date. Run 'pnpm typegen' and commit the result."
            exit 1
          fi
